name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cardforge
          POSTGRES_PASSWORD: cardforge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cardforge"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CARDFORGE_TEST_DATABASE_URL: postgres://postgres:cardforge_ci@127.0.0.1:5432/cardforge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (build all packages)
        run: pnpm exec tsc -b
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Unit, contract, and determinism tests
        run: pnpm test
      - name: Simulation sample (50 games, every replay verified)
        run: node apps/simulator/dist/cli.js --games 50 --seed 1
      - name: Build web
        run: pnpm --filter @cardforge/web build

  smoke:
    name: Server and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cardforge
          POSTGRES_PASSWORD: cardforge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cardforge"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:cardforge_ci@127.0.0.1:5432/cardforge
      CARDFORGE_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b && pnpm --filter @cardforge/web build
      - name: Smokes
        run: scripts/ci/run-smokes.sh
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs/

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build match-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: match-server
          push: false
          cache-from: type=gha,scope=match-server
          cache-to: type=gha,mode=max,scope=match-server
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
