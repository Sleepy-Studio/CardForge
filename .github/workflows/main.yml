name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Full tests and archetype matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cardforge
          POSTGRES_PASSWORD: cardforge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cardforge"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CARDFORGE_TEST_DATABASE_URL: postgres://postgres:cardforge_ci@127.0.0.1:5432/cardforge
      DATABASE_URL: postgres://postgres:cardforge_ci@127.0.0.1:5432/cardforge
      CARDFORGE_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: 12×12 archetype matrix (seat-swapped, every replay verified)
        run: node apps/simulator/dist/cli.js --matrix --games-per-seat 2 --seed 1
      - run: pnpm --filter @cardforge/web build
      - name: Smokes
        run: scripts/ci/run-smokes.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-logs
          path: smoke-logs/

  images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push match-server
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cardforge-match-server"
          docker build --target match-server \
            --build-arg "CARDFORGE_VERSION=$TAG" --build-arg "CARDFORGE_COMMIT=$GITHUB_SHA" \
            --tag "$image:$TAG" --tag "$image:main" .
          docker push --all-tags "$image"
      - name: Push web
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cardforge-web"
          docker build --target web --build-arg "CARDFORGE_VERSION=$TAG" \
            --tag "$image:$TAG" --tag "$image:main" .
          docker push --all-tags "$image"

  staging:
    name: Deploy staging and smoke it
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 20
    environment: staging
    env:
      COOLIFY_STAGING_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      CARDFORGE_SMOKE_SIGNUP_CODE: ${{ secrets.STAGING_SIGNUP_CODE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip when staging is not configured
        if: env.COOLIFY_STAGING_WEBHOOK == ''
        run: echo "::notice::COOLIFY_STAGING_WEBHOOK is not set; skipping staging deploy."
      - name: Trigger Coolify deploy
        if: env.COOLIFY_STAGING_WEBHOOK != ''
        run: |
          curl -fsS -X GET "$COOLIFY_STAGING_WEBHOOK" -H "Authorization: Bearer $COOLIFY_API_TOKEN"
      - name: Wait for the new build to report ready
        if: env.COOLIFY_STAGING_WEBHOOK != ''
        run: |
          for _ in $(seq 1 120); do
            version=$(curl -fsS "$STAGING_API_URL/health" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            ready=$(curl -fsS -o /dev/null -w '%{http_code}' "$STAGING_API_URL/ready" || true)
            if [ "$version" = "$GITHUB_SHA" ] && [ "$ready" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Staging did not become ready on $GITHUB_SHA" >&2; exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.COOLIFY_STAGING_WEBHOOK != ''
        with:
          node-version: 22
      - name: Install pnpm
        if: env.COOLIFY_STAGING_WEBHOOK != ''
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Staging journey smoke
        if: env.COOLIFY_STAGING_WEBHOOK != ''
        env:
          CARDFORGE_SERVER_URL: ${{ vars.STAGING_API_URL }}
          CARDFORGE_SMOKE_ORIGIN: ${{ vars.STAGING_WEB_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm --filter @cardforge/match-server smoke:journey
          curl -fsS "$STAGING_WEB_URL/healthz"
