name: Nightly simulation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - name: 1,000-game batch with replay verification
        run: node apps/simulator/dist/cli.js --games 1000 --seed $(date +%j) | tee batch.json
      - name: Seat-swapped archetype matrix, 4 games per seat
        run: node apps/simulator/dist/cli.js --matrix --games-per-seat 4 --seed $(date +%j) | tee matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-simulation
          path: "*.json"
