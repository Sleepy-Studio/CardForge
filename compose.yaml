services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cardforge
      POSTGRES_PASSWORD: cardforge_dev
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - cardforge-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cardforge"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  cardforge-postgres-dev-data:
